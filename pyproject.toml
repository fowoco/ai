[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fowoco-ai"
version = "0.1.0"
description = "FOWOCO AI Agent Server (FastAPI) — Language Assistant and workflow agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "httpx>=0.28,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "olefile>=0.47,<1",
  "ms-cfb==0.0.6",
  "Pillow>=11.3,<12",
  "hwp2hwpx==1.0.1",
  "langgraph>=0.2,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.12,<1",
]
# 로컬: pip install -e ../knowledge/fowoco-knowledge
knowledge = []

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.documents.hwp5.templates" = ["*.json", "*.hwp"]
"app.documents.hwpx.templates" = ["*.hwpx"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
