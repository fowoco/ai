[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fowoco-ai"
version = "0.1.0"
description = "FOWOCO AI Agent Server (FastAPI) — Language Assistant and workflow agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "httpx>=0.28,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "olefile>=0.47,<1",
  "ms-cfb==0.0.6",
  "Pillow>=11.3,<12",
  "hwp2hwpx==1.0.1",
  "langgraph>=0.2,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.12,<1",
]
# 로컬: pip install -e ../knowledge/fowoco-knowledge
knowledge = []
# HF Intent BERT (Windows CPU 권장: pip install -e ".[intent]")
intent = [
  "torch>=2.2,<3",
  "transformers>=4.46,<5",
  "accelerate>=0.34,<2",
]
# A.X 경로 (Linux/CUDA 권장). Windows에선 bitsandbytes 설치 실패 흔함
intent-ax = [
  "fowoco-ai[intent]",
  "peft>=0.13,<1",
  "bitsandbytes>=0.44,<1",
]
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.documents.hwp5.templates" = ["*.json", "*.hwp"]
"app.documents.hwpx.templates" = ["*.hwpx"]
"app.agents.language.resources" = ["*.json", "*.sha256", "prompts/*.md"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "qdrant_integration: mark test as requiring Qdrant integration",
    "language_models: mark test as requiring language model cache",
]


[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
