name: fowoco

services:
  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: fowoco-qdrant
    restart: unless-stopped
    # 내부전용 — 호스트 포트 노출 없음
    expose:
      - "6333"
      - "6334"
    volumes:
      - fowoco-qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: fowoco-ai:latest
    container_name: fowoco-ai
    init: true
    restart: unless-stopped
    ports:
      - "${FOWOCO_PORT:-8000}:8000"
    environment:
      FOWOCO_DOCUMENT_SNAPSHOT_DIR: /data/document-snapshots
      FOWOCO_QDRANT_URL: http://qdrant:6333
      FOWOCO_MODEL_CACHE_DIR: /data/model-cache
    volumes:
      - fowoco-document-data:/data
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  fowoco-document-data:
    name: fowoco-document-data
  fowoco-qdrant-data:
    name: fowoco-qdrant-data
