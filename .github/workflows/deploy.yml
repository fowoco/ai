name: deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/fowoco/ai:latest
            ghcr.io/fowoco/ai:${{ github.sha }}

      - name: Set up kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Checkout infra manifests
        uses: actions/checkout@v4
        with:
          repository: fowoco/infra
          path: infra

      - name: Bootstrap k8s resources
        run: |
          kubectl apply -f infra/k8s/00-namespace.yaml
          kubectl apply -f infra/k8s/03-ai.yaml

      - name: Rollout
        run: |
          kubectl -n fowoco set image deployment/ai \
            ai=ghcr.io/fowoco/ai:${{ github.sha }} \
            --record=false
          kubectl -n fowoco rollout status deployment/ai --timeout=600s

      - name: Rollout diagnostics
        if: failure()
        run: |
          echo "::group::pods"
          kubectl -n fowoco get pods -o wide -l app=ai
          echo "::endgroup::"
          echo "::group::describe deployment"
          kubectl -n fowoco describe deployment/ai
          echo "::endgroup::"
          echo "::group::describe pods"
          kubectl -n fowoco describe pods -l app=ai
          echo "::endgroup::"
          echo "::group::logs (current)"
          kubectl -n fowoco logs deployment/ai --tail=200 --all-containers
          echo "::endgroup::"
          echo "::group::logs (previous, if crashed)"
          kubectl -n fowoco logs deployment/ai --tail=200 --all-containers --previous || true
          echo "::endgroup::"
          echo "::group::events"
          kubectl -n fowoco get events --sort-by=.lastTimestamp | tail -40
          echo "::endgroup::"
