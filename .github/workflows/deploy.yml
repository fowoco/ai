name: deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/fowoco/ai:latest
            ghcr.io/fowoco/ai:${{ github.sha }}

      - name: Set up kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Rollout
        run: |
          if ! kubectl -n fowoco get deployment/ai >/dev/null 2>&1; then
            echo "::error::deployment/ai가 아직 없습니다. fowoco/infra의 k8s manifest로 최초 배포를 먼저 진행해 주세요 (kubectl apply -f k8s/)."
            exit 1
          fi

          kubectl -n fowoco set image deployment/ai \
            ai=ghcr.io/fowoco/ai:${{ github.sha }} \
            --record=false
          kubectl -n fowoco rollout status deployment/ai --timeout=180s
